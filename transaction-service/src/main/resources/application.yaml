spring:
  application:
    name: transaction-service

  datasource:
    url: jdbc:postgresql://postgres:5432/payment
    username: payment
    password: payment
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cloud:
    function:
      definition: transactionCreated; fraudDecision; transactionFinally
    stream:
      defaultBinder: kafka
      bindings:
        sendTransaction-out-0:
          destination: payments.transaction.v1
          content-type: application/json
        fraudDecision-in-0:
          destination: payments.fraud.v1
          group: transaction-service
          content-type: application/json
        transactionFinally-in-0:
          destination: payments.wallet.v1
          group: transaction-service
          content-type: application/json
      kafka:
        binder:
          brokers: kafka:9092

server:
  port: 8081