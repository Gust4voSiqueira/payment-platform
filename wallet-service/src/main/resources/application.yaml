spring:
  application:
    name: wallet-service

  datasource:
    url: jdbc:postgresql://postgres:5432/payment
    username: payment
    password: payment
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cloud:
    function:
      definition: consumerTransaction; walletReserved; walletFinally
    stream:
      bindings:
        consumerTransaction-in-0:
          destination: payments.transaction.v1
          group: wallet-service
          content-type: application/json
        sendWallet-out-0:
          destination: payments.wallet.v1
          content-type: application/json
      kafka:
        binder:
          brokers: kafka:9092

server:
  port: 8082